name: say hello

on:
  workflow_dispatch:

jobs:
  run-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: say hello
        run: |
          python hello.py
          pwd
          cd ~
          pwd
          sleep 60
